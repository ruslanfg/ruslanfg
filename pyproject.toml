[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldcup-2026-dashboard"
version = "0.1.0"
description = "Live 2026 FIFA World Cup prediction + betting-market dashboard. Aggregates fixtures, a transparent win-probability model, sportsbook + Polymarket odds, and public Polymarket trader positions. Information only — not betting advice."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27,<0.29",
    "apscheduler>=3.10,<4",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
]

[tool.setuptools]
packages = [
    "backend",
    "backend.sources",
    "backend.winprob",
]
