# =============================================================================
# Polymarket BTC 5-Minute Paper-Trading Bot — SINGLE SOURCE OF TRUTH for tunables
# =============================================================================
# This is the ONLY config file. Every tunable lives here. Secrets do NOT live
# here — put them in .env and reference them as ${VAR_NAME} below.
#
# PAPER TRADING ONLY. This bot never signs transactions, never touches a wallet
# key, and never sends real funds. All fills are simulated against live prices.
# =============================================================================

data:
  # mode: how the bot sources market/trader data.
  #   live  — only the real Polymarket / Polygon APIs (fails loudly if blocked)
  #   sim   — only the built-in deterministic simulator (no network)
  #   auto  — try live; if every live source is unreachable, fall back to sim
  #           and log the gap. (Recommended for restricted networks.)
  mode: auto

  # Base URLs (public, no auth required for the read-only endpoints we use).
  gamma_base_url: "https://gamma-api.polymarket.com"
  clob_base_url: "https://clob.polymarket.com"
  data_api_base_url: "https://data-api.polymarket.com"
  ws_url: "wss://ws-subscriptions-clob.polymarket.com/ws/"

  # Polygon JSON-RPC endpoint for on-chain trader tracking (CTF Exchange logs).
  # Optional. Public default; override with your own (Alchemy/Infura) in .env.
  polygon_rpc_url: "${POLYGON_RPC_URL}"

  # Augment Data API trade tape with on-chain CTF Exchange OrderFilled logs.
  # Read-only log scanning; needs polygon_rpc_url. Off by default (Data API is primary).
  enable_onchain: false

  # Networking
  poll_interval_seconds: 5         # main loop cadence (lower = catches more entries)
  http_timeout_seconds: 12
  max_retries: 3
  retry_backoff_seconds: 1

market:
  # The recurring "Bitcoin Up or Down — 5 Minute" market discovery hints.
  # The discoverer searches Gamma for the currently-active 5-min BTC market
  # using these. Adjust only if Polymarket renames the series.
  asset_symbol: "BTC"
  series_slugs:                    # candidate series/event slugs to match
    - "bitcoin-up-or-down"
    - "btc-up-or-down"
  question_contains:               # case-insensitive substrings to match the question
    - "bitcoin up or down"
    - "btc up or down"
  duration_minutes: 5             # used to detect rollover & sanity-check windows

wallets:
  # Trader tracking / ranking.
  lookback_days: 7                 # history window for scoring (default 7)
  min_trades: 15                   # ignore wallets with fewer trades in the window
  top_n: 40                        # mirror trades from the top-N ranked wallets
  refresh_interval_seconds: 300    # how often to re-rank tracked wallets
  max_wallets_tracked: 200         # cap on universe size kept in the DB
  # LIVE cold-start: on startup, backfill this many recent resolved BTC 5-min
  # markets (+ their trades) so the leaderboard is populated immediately instead
  # of slowly filling over hours. 0 disables. ~180 ≈ 15h of 5-min markets.
  # (Ignored in sim mode, which seeds its own history.)
  backfill_windows: 180

  # Scoring function:  score = (win_rate ** wr_exp) weighted-combined with a
  # volume-weighted, normalized realized PnL. Weights are normalized internally.
  scoring:
    win_rate_weight: 0.5           # weight on win rate component
    pnl_weight: 0.4                # weight on (volume-weighted) realized PnL
    volume_weight: 0.1             # weight on raw traded volume (activity bonus)
    win_rate_exponent: 1.0         # >1 punishes low win rate harder

engine:
  # Paper-trading bankroll & sizing.
  starting_bankroll: 1000.0        # USDC (paper) starting equity
  bankroll_fraction: 0.10          # fraction of CURRENT bankroll per copied trade
  slippage_bps: 50                 # simulated slippage in basis points (50 = 0.50%)
  min_position_usd: 1.0            # skip copied trades smaller than this
  max_open_positions: 50           # safety cap on simultaneously open paper positions
  max_position_usd: 500.0          # hard cap on any single paper position
  # Risk management:
  # Skip copies whose fill price is outside [min,max]. High-priced longs have the
  # worst payoff (a loss costs the full stake, a win pays little), so we cap entries.
  max_entry_price: 0.65            # skip entries priced above this (0.999 = off)
  min_entry_price: 0.0             # skip entries priced below this (0 = off)
  # Drawdown circuit breaker: stop opening NEW positions once equity falls below
  # (1 - max_drawdown_pct) of the starting bankroll. Open positions still resolve.
  # Auto-resumes if equity recovers. 0 disables.
  max_drawdown_pct: 0.25
  # Only mirror a source wallet's ENTRY (BUY) into the live 5-min market.
  mirror_sells: false

sim:
  # Deterministic offline simulator (used in mode=sim, or auto-fallback).
  seed: 1337
  num_wallets: 40                  # synthetic tracked wallets to generate
  btc_start_price: 65000.0
  btc_volatility_bps: 8            # per-tick BTC vol in bps (random walk)
  wallet_trade_rate: 0.35          # prob. a top wallet enters each new market
  accelerate: true                 # compress the 5-min window for fast demos
  accelerated_window_seconds: 60   # a "5-min" market lasts this long when accelerated

api:
  host: "127.0.0.1"
  port: 8000
  cors_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
  ws_broadcast_interval_seconds: 2 # how often the server pushes a state snapshot

storage:
  db_path: "data/paper_trading.db"

logging:
  level: "INFO"                    # DEBUG | INFO | WARNING | ERROR
  file: "logs/bot.log"
  json: false
